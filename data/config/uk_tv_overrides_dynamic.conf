# UK TV Guide Override Configuration - Dynamic Version
# 
# This configuration supports two types of operations:
# 1. REPLACE existing channels with other channels from the playlist
# 2. ADD new channels to specific positions in the playlist
#
# =============================================================================
# REPLACE OPERATIONS
# =============================================================================
# Format: source_channel_name = replacement_channel_name
# This replaces UK TV Guide entries with other entries from the playlist
#
# Examples (uncomment to use):
BBC One = BBC One London
# BBC Two = BBC Two England
ITV 1 = ITV London
Channel 4 = Channel 4 London
# Channel 5 = Channel 5 London

# =============================================================================
# ADD OPERATIONS  
# =============================================================================
# Format: [ADD:position] channel_name = EXTINF_line|URL_line
# This adds completely new channels to the playlist at specified positions
#
# Position options:
# - TOP: Add to the beginning of the UK TV Guide group
# - BOTTOM: Add to the end of the UK TV Guide group  
# - AFTER:channel_name: Add after a specific existing channel
# - BEFORE:channel_name: Add before a specific existing channel
# - INDEX:n: Add at specific index position (0-based)
#
# EXTINF format: #EXTINF:duration CUID="id" tvg-name="name" tvg-id="id" tvg-logo="logo" group-title="🇬🇧 TV Guide (UK)",Channel Name
# URL format: http://server:port/username/password/stream_id
#
# Examples (uncomment to use):
# [ADD:TOP] My Custom Channel = #EXTINF:0 CUID="custom1" tvg-name="My Custom Channel" tvg-id="mycustom.uk" tvg-logo="https://example.com/logo.png" group-title="🇬🇧 TV Guide (UK)",My Custom Channel|http://example.com/stream
# [ADD:BOTTOM] Test Channel = #EXTINF:0 CUID="test1" tvg-name="Test Channel" tvg-id="test.uk" tvg-logo="" group-title="🇬🇧 TV Guide (UK)",Test Channel|http://test.example.com/stream
# [ADD:AFTER:BBC One] BBC One Backup = #EXTINF:0 CUID="bbcbackup" tvg-name="BBC One Backup" tvg-id="bbconebackup.uk" tvg-logo="" group-title="🇬🇧 TV Guide (UK)",BBC One Backup|http://backup.example.com/bbc1
# [ADD:BEFORE:ITV 1] ITV Preview = #EXTINF:0 CUID="itvprev" tvg-name="ITV Preview" tvg-id="itvpreview.uk" tvg-logo="" group-title="🇬🇧 TV Guide (UK)",ITV Preview|http://preview.example.com/itv
# [ADD:INDEX:5] Channel at Position 5 = #EXTINF:0 CUID="pos5" tvg-name="Position 5 Channel" tvg-id="pos5.uk" tvg-logo="" group-title="🇬🇧 TV Guide (UK)",Channel at Position 5|http://example.com/pos5

